# Deploys the edge Worker and the web container to Cloudflare. Manual only:
# run it from the Actions tab once CI has passed on the commit. wrangler builds
# ../Dockerfile on the runner and pushes it to Cloudflare's registry.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, Containers
# and R2 edit) and CLOUDFLARE_ACCOUNT_ID, in the "production" (and "staging")
# environment, so a reviewer can be required. PROXY_SECRET is set once with `wrangler secret
# put`, not here. Draft: not yet run against Cloudflare.
#
# Targets (edge/wrangler.jsonc):
#   no-route   (default) the Worker and containers WITHOUT the bodhiraai.com route:
#              takes no production traffic. Use before cut-over.
#   production adds the bodhiraai.com/* route (`--env production`). Cut-over step 7
#              (docs/cutover-runbook.md) and every deploy after it.
#   staging    edge/wrangler.staging.jsonc (staging Worker, route and buckets).
name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: no-route (no bodhiraai.com route), production (bodhiraai.com/* route; cut-over step 7 onwards) or staging
        type: choice
        options: [no-route, production, staging]
        default: no-route
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    # no-route uses the production environment's secrets and reviewer too.
    environment: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy ${{ inputs.target == 'staging' && '-c wrangler.staging.jsonc' || inputs.target == 'production' && '-c wrangler.jsonc --env production' || '-c wrangler.jsonc --env=' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
