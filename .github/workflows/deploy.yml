# Deploys the web Worker (worker/index.ts + the OpenNext build of the Next.js
# app) to Cloudflare. Manual only: run it from the Actions tab once CI has
# passed on the commit. `npm run cf:deploy` (opennextjs-cloudflare deploy)
# uploads the build's cache entries to the R2 cache bucket, then runs
# `wrangler deploy`.
#
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the
# "production" (and "staging") environment, so a reviewer can be required.
# Token permissions: Account > Workers Scripts edit, Workers R2 Storage edit;
# Zone (bodhiraai.com) > Workers Routes edit. APP_SECRET (the API's value)
# is set once with `wrangler secret put APP_SECRET`, not here. Draft: not yet run against Cloudflare.
#
# Targets (wrangler.jsonc):
#   no-route   (default) top level: the Worker WITHOUT the bodhiraai.com route, so it
#              takes no production traffic (*.workers.dev only). Use before cut-over.
#   production env production: adds the bodhiraai.com/* route. Cut-over step 7
#              (docs/cutover-runbook.md) and every deploy after it.
#   staging    env staging: the staging Worker, route and buckets.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: no-route (no bodhiraai.com route), production (bodhiraai.com/* route; cut-over step 7 onwards) or staging
        type: choice
        options: [no-route, production, staging]
        default: no-route
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    # no-route uses the production environment's secrets and reviewer too.
    environment: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:worker
      - run: npm run cf:build
      - run: npm run cf:deploy -- ${{ inputs.target == 'staging' && '--env staging' || inputs.target == 'production' && '--env production' || '--env=' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
