# Checks every push and pull request: the Next.js app (plain `next build`, as
# the Hostinger host runs it), the Worker's tests, and the OpenNext Cloudflare
# build with a wrangler dry run for each target. Nothing here talks to Cloudflare.
name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # `npm run build` + `next start` hosting (Hostinger). It doesn't call the API.
      - run: npm run build
  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Signed /files/* links (incl. the API's fixed vector), legacy keys, body limits.
      # node --test; Node 22.18+ strips the types.
      - run: npm run test:worker
      - run: npm run cf:build
      - run: npx tsc --noEmit -p worker
      # Bundles the Worker exactly as a deploy would, without uploading. Prints the size.
      - run: npx wrangler deploy --dry-run --outdir dist --env= # no-route (top level)
      - run: npx wrangler deploy --dry-run --outdir dist --env production
      - run: npx wrangler deploy --dry-run --outdir dist --env staging
